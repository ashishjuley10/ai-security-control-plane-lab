[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-control-plane-lab"
version = "0.2.1"
description = "Defensive GenAI security control-plane lab for a fictional financial-services assistant"
requires-python = ">=3.8"
authors = [{name = "Ashish Juley"}]
keywords = ["ai-security", "genai-security", "llm-security", "prompt-injection", "security-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/ashishjuley10/ai-security-control-plane-lab"

[tool.setuptools.packages.find]
include = ["ai_security_lab*"]
