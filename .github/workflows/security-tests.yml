name: adversarial-security-tests

on:
  push:
  pull_request:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: pip install -e .
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate adversarial evaluation
        run: python scripts/run_evaluation.py
      - name: Generate benign task evaluation
        run: python scripts/run_benign_evaluation.py
      - name: Generate v0.2 metrics
        run: python scripts/run_v2_metrics.py
